name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compila todos os scripts
        run: python -m py_compile scripts/*.py tools/*.py tests/*.py
      - name: Testes (so dado sintetico, sem rede)
        run: python -m unittest discover -s tests -v
      - name: Demo ponta a ponta, offline
        run: |
          python scripts/gerar_exemplo.py
          python scripts/atualizar.py --sem-api --sem-push --sem-backup
          test -s data/painel.html
      - name: Trava de dado pessoal
        run: python tools/checar_dados_pessoais.py

  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"  # comentar no PR pediria permissao de escrita
