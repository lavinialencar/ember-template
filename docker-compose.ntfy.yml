# Your own ntfy on a server (optional; without it Ember uses public ntfy.sh with a secret topic).
# Usage: docker compose -f docker-compose.ntfy.yml up -d
# Then: NTFY_URL in Ember's .env points here; in the ntfy phone app, use your own server.
# NTFY_UPSTREAM_BASE_URL makes iOS phones get the notice right away (Apple push goes through a central server);
# only the message id goes up to ntfy.sh, not the text.
services:
  ntfy:
    image: binwiederhier/ntfy:v2.28.0   # pinned version; Dependabot opens a PR when a new one comes out
    container_name: ember-ntfy
    restart: unless-stopped
    command: ["serve"]
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL}          # e.g. http://<server>.<tailnet>.ts.net:8081
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all       # only login or token gets in (NTFY_TOKEN in .env)
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_lib:/var/lib/ntfy
    ports:
      # Only listens on NTFY_BIND (default 127.0.0.1). For the phone to reach it through Tailscale:
      # NTFY_BIND=<server IP on Tailscale> (the 100.x.y.z from `tailscale ip -4`) in .env. Never 0.0.0.0.
      - "${NTFY_BIND:-127.0.0.1}:8081:80"

volumes:
  ntfy_cache:
  ntfy_lib:
