<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif">
  <title id="t">Zonas de confiança do Ember</title>
  <desc id="d">Três zonas. Internet: Pluggy, BrasilAPI, ntfy.sh, cdnjs e a pasta na nuvem. Tailnet do Tailscale: o celular e a sua máquina ou servidor. Na máquina: .env e data com permissão 0600 e fora do git, painel.html com CSP e SRI, e as portas do webhook, do ntfy próprio e do Postgres presas em 127.0.0.1 ou no IP do Tailscale. Fluxos: 1 HTTPS para a Pluggy, 2 só o CNPJ de empresa para a BrasilAPI, 3 push sem valor nem nome para o ntfy.sh, 4 Chart.js com SRI, 5 backup cifrado para a nuvem, 6 o celular chama o webhook com token. Nenhuma porta fica aberta para a internet. A chave privada do backup fica num gerenciador de senhas, fora da máquina. Não protege contra máquina comprometida nem esconde os metadados do ntfy.sh.</desc>
