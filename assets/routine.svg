  <rect x="1" y="1" width="1198" height="598" fill="#FFFFFF" stroke="#DDE1E7" stroke-width="2"/>
  <text x="32" y="46" font-size="21" font-weight="700" fill="#12151A">Daily routine: scripts/update.py</text>
  <text x="32" y="70" font-size="14" fill="#454B55">one step after another; an error stops the routine, except in the push</text>
  <rect x="32" y="92" width="300" height="56" rx="4" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="1.5"/>
  <use href="#clock" x="42" y="100" width="40" height="40"/>
  <text x="92" y="116" font-size="14" font-weight="600" fill="#12151A" text-anchor="start">Trigger</text>
  <text x="92" y="135" font-size="13" font-weight="400" fill="#454B55" text-anchor="start">cron, launchd or scheduler.py</text>
  <rect x="778" y="92" width="390" height="56" rx="4" fill="#FFFFFF" stroke="#86AEDB" stroke-width="1.5" stroke-dasharray="6 4"/>
  <use href="#document" x="788" y="100" width="40" height="40"/>
  <text x="838" y="116" font-size="14" font-weight="600" fill="#12151A" text-anchor="start">First run only</text>
  <text x="838" y="135" font-size="13" font-weight="400" fill="#454B55" text-anchor="start">fetch_history.py, fetch_bills.py, classify.py</text>
  <rect x="32" y="196" width="200" height="100" rx="4" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="1.5"/>
  <circle cx="56" cy="222" r="11" fill="#1F4E8C" stroke="#FFFFFF" stroke-width="2"/><text x="56" y="226" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="76" y="227" font-size="15" font-weight="600" fill="#12151A" text-anchor="start">Fetch new</text>
  <use href="#cloud" x="192" y="204" width="32" height="32"/>
  <text x="48" y="260" font-size="13" font-weight="400" fill="#12151A" text-anchor="start">25-day window</text>
  <text x="48" y="280" font-size="13" font-weight="400" fill="#454B55" text-anchor="start">writes transactions.json</text>
  <rect x="262" y="196" width="200" height="100" rx="4" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="1.5"/>
  <circle cx="286" cy="222" r="11" fill="#1F4E8C" stroke="#FFFFFF" stroke-width="2"/><text x="286" y="226" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="306" y="227" font-size="15" font-weight="600" fill="#12151A" text-anchor="start">Fetch bills</text>
  <use href="#cloud" x="422" y="204" width="32" height="32"/>
  <text x="278" y="260" font-size="13" font-weight="400" fill="#12151A" text-anchor="start">fetch_bills.py</text>
  <text x="278" y="280" font-size="13" font-weight="400" fill="#454B55" text-anchor="start">writes bills.json</text>
  <rect x="492" y="196" width="200" height="100" rx="4" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="1.5"/>
  <circle cx="516" cy="222" r="11" fill="#1F4E8C" stroke="#FFFFFF" stroke-width="2"/><text x="516" y="226" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="536" y="227" font-size="15" font-weight="600" fill="#12151A" text-anchor="start">Look up CNPJ</text>
  <use href="#cloud" x="652" y="204" width="32" height="32"/>
  <text x="508" y="260" font-size="13" font-weight="400" fill="#12151A" text-anchor="start">enrich_cnpj.py</text>
  <text x="508" y="280" font-size="13" font-weight="400" fill="#454B55" text-anchor="start">writes cnpj_rules.json</text>
  <rect x="722" y="196" width="200" height="100" rx="4" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="1.5"/>
  <circle cx="746" cy="222" r="11" fill="#1F4E8C" stroke="#FFFFFF" stroke-width="2"/><text x="746" y="226" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="766" y="227" font-size="15" font-weight="600" fill="#12151A" text-anchor="start">Classify</text>
  <use href="#filter" x="882" y="204" width="32" height="32"/>
  <text x="738" y="260" font-size="13" font-weight="400" fill="#12151A" text-anchor="start">classify.py</text>
  <text x="738" y="280" font-size="13" font-weight="400" fill="#454B55" text-anchor="start">writes flow.json</text>
  <rect x="952" y="196" width="200" height="100" rx="4" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="1.5"/>
  <circle cx="976" cy="222" r="11" fill="#1F4E8C" stroke="#FFFFFF" stroke-width="2"/><text x="976" y="226" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="996" y="227" font-size="15" font-weight="600" fill="#12151A" text-anchor="start">Build alerts</text>
  <use href="#bell" x="1112" y="204" width="32" height="32"/>
  <text x="968" y="260" font-size="13" font-weight="400" fill="#12151A" text-anchor="start">alerts.py</text>
  <text x="968" y="280" font-size="13" font-weight="400" fill="#454B55" text-anchor="start">writes alerts.json</text>
  <rect x="952" y="400" width="200" height="100" rx="4" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="1.5"/>
  <circle cx="976" cy="426" r="11" fill="#1F4E8C" stroke="#FFFFFF" stroke-width="2"/><text x="976" y="430" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="996" y="431" font-size="15" font-weight="600" fill="#12151A" text-anchor="start">Send push</text>
  <use href="#phone" x="1120" y="408" width="24" height="32"/>
  <text x="968" y="464" font-size="13" font-weight="400" fill="#12151A" text-anchor="start">notify.py</text>
  <text x="968" y="484" font-size="13" font-weight="400" fill="#454B55" text-anchor="start">push, no amount</text>
  <rect x="722" y="400" width="200" height="100" rx="4" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="1.5"/>
  <circle cx="746" cy="426" r="11" fill="#1F4E8C" stroke="#FFFFFF" stroke-width="2"/><text x="746" y="430" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
  <text x="766" y="431" font-size="15" font-weight="600" fill="#12151A" text-anchor="start">Aggregate</text>
  <use href="#cylinder" x="882" y="408" width="32" height="32"/>
  <text x="738" y="464" font-size="13" font-weight="400" fill="#12151A" text-anchor="start">dashboard_data.py</text>
  <text x="738" y="484" font-size="13" font-weight="400" fill="#454B55" text-anchor="start">writes dashboard.json</text>
  <rect x="492" y="400" width="200" height="100" rx="4" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="1.5"/>
  <circle cx="516" cy="426" r="11" fill="#1F4E8C" stroke="#FFFFFF" stroke-width="2"/><text x="516" y="430" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
  <text x="536" y="431" font-size="14" font-weight="600" fill="#12151A" text-anchor="start">Build dashboard</text>
  <use href="#chart" x="652" y="408" width="32" height="32"/>
  <text x="508" y="464" font-size="13" font-weight="400" fill="#12151A" text-anchor="start">dashboard_build.py</text>
  <text x="508" y="484" font-size="13" font-weight="400" fill="#454B55" text-anchor="start">writes dashboard.html</text>
  <rect x="262" y="400" width="200" height="100" rx="4" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="1.5"/>
  <circle cx="286" cy="426" r="11" fill="#1F4E8C" stroke="#FFFFFF" stroke-width="2"/><text x="286" y="430" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text>
  <text x="306" y="431" font-size="15" font-weight="600" fill="#12151A" text-anchor="start">Encrypt backup</text>
  <use href="#lock" x="422" y="408" width="32" height="32"/>
  <text x="278" y="464" font-size="13" font-weight="400" fill="#12151A" text-anchor="start">backup.py</text>
  <text x="278" y="484" font-size="13" font-weight="400" fill="#454B55" text-anchor="start">encrypts to BACKUP_DEST</text>
  <path d="M132 148 V194" stroke="#1F4E8C" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M232 246 H260" stroke="#1F4E8C" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M462 246 H490" stroke="#1F4E8C" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M692 246 H720" stroke="#1F4E8C" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M922 246 H950" stroke="#1F4E8C" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M1052 296 V398" stroke="#1F4E8C" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M952 450 H924" stroke="#1F4E8C" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M722 450 H694" stroke="#1F4E8C" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M492 450 H464" stroke="#1F4E8C" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M262 450 H234" stroke="#454B55" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/>
  <rect x="32" y="400" width="200" height="100" rx="4" fill="#FFFFFF" stroke="#454B55" stroke-width="1.5" stroke-dasharray="6 4"/>
  <use href="#server" x="44" y="408" width="32" height="32"/>
  <text x="84" y="430" font-size="14" font-weight="600" fill="#12151A" text-anchor="start">Server only</text>
  <text x="48" y="464" font-size="13" font-weight="400" fill="#12151A" text-anchor="start">build_load_sql.py</text>
  <text x="48" y="484" font-size="13" font-weight="400" fill="#454B55" text-anchor="start">psql, if a password is set</text>
  <path d="M32 306 V316 H692 V306" fill="none" stroke="#454B55" stroke-width="1.5"/>
  <text x="362" y="338" font-size="13" font-weight="600" fill="#454B55" text-anchor="middle">1 to 3 skipped with --no-api</text>
  <text x="1052" y="524" font-size="13" font-weight="600" fill="#454B55" text-anchor="middle">skipped with --no-push</text>
  <text x="362" y="524" font-size="13" font-weight="600" fill="#454B55" text-anchor="middle">skipped with --no-backup</text>
  <text x="32" y="568" font-size="14" font-weight="400" fill="#12151A" text-anchor="start">Offline demo: update.py --no-api --no-push --no-backup runs only 4, 5, 7 and 8.</text>
