      <path d="M13 13 L35 35" stroke="#B23A3A" stroke-width="3"/>
    </symbol>
    <symbol id="finger" viewBox="0 0 48 48">
      <rect x="10" y="10" width="28" height="18" rx="4" fill="#C4D7EE" stroke="#1F4E8C" stroke-width="2.5"/>
      <path d="M24 34 V20" stroke="#1F4E8C" stroke-width="3" stroke-linecap="round"/>
      <circle cx="24" cy="38" r="4" fill="#1F4E8C"/>
    </symbol>
    <symbol id="tunnel" viewBox="0 0 48 48">
      <circle cx="12" cy="24" r="6" fill="#C4D7EE" stroke="#1F4E8C" stroke-width="2.5"/>
      <circle cx="36" cy="24" r="6" fill="#C4D7EE" stroke="#1F4E8C" stroke-width="2.5"/>
      <path d="M18 24 H30" stroke="#1F4E8C" stroke-width="2.5" stroke-dasharray="3 3"/>
      <path d="M12 12 V6 M36 12 V6 M12 42 V36 M36 42 V36" stroke="#86AEDB" stroke-width="2.5"/>
    </symbol>
