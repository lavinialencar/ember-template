<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif">
  <title id="t">Ember trust zones</title>
  <desc id="d">Three zones. Internet: Pluggy, BrasilAPI, ntfy.sh, cdnjs and the cloud folder. Tailscale tailnet: the phone and your machine or server. On the machine: .env and data with 0600 permissions and kept out of git, dashboard.html with CSP and SRI, and the ports of the webhook, the self-hosted ntfy and Postgres bound to 127.0.0.1 or the Tailscale IP. Flows: 1 HTTPS to Pluggy, 2 only company CNPJs to BrasilAPI, 3 push with no amount or name to ntfy.sh, 4 Chart.js with SRI, 5 encrypted backup to the cloud, 6 the phone calls the webhook with a token. No port is open to the internet. The backup private key lives in a password manager, off the machine. It does not protect against a compromised machine and does not hide ntfy.sh metadata.</desc>
