<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif">
  <title id="t">Rotina diária do Ember</title>
  <desc id="d">Ordem dos passos de scripts/atualizar.py. Um gatilho (cron, launchd ou agendador.py) dispara a rotina. 1 baixa o que é novo, 2 baixa as faturas, 3 consulta CNPJ na BrasilAPI; esses três são pulados com --sem-api. 4 classifica em fluxo.json, 5 gera alertas.json, 6 manda o push pelo ntfy (pulado com --sem-push), 7 agrega painel.json, 8 monta painel.html, 9 grava o backup cifrado (pulado com --sem-backup). No servidor, o agendador ainda gera carga.sql e carrega no Postgres.</desc>
