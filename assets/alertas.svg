      <circle cx="24" cy="38" r="4" fill="#1F4E8C"/>
    </symbol>
    <symbol id="tunel" viewBox="0 0 48 48">
      <circle cx="12" cy="24" r="6" fill="#C4D7EE" stroke="#1F4E8C" stroke-width="2.5"/>
      <circle cx="36" cy="24" r="6" fill="#C4D7EE" stroke="#1F4E8C" stroke-width="2.5"/>
