<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="t d" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif">
  <title id="t">Caminho de um alerta no Ember</title>
  <desc id="d">1 alertas.py grava alertas.json. 2 notificar.py manda ao ntfy um push sem valor nem nome, com botões. 3 o ntfy entrega no celular. 4 você toca num botão. Caminho A, ntfy.sh público: 5A o botão posta no tópico de resposta um corpo assinado com HMAC, 6A na rodada seguinte notificar.py lê o tópico de resposta, 7A confere a assinatura e grava o estado. Caminho B, ntfy próprio: 5B o botão chama o webhook do agendador.py com o token no cabeçalho, 6B o agendador valida e grava o estado sob trava; token errado recebe 403 e o IP é bloqueado após 5 erros.</desc>
