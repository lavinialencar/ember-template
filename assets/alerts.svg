  <circle cx="126" cy="212" r="11" fill="#1F4E8C" stroke="#FFFFFF" stroke-width="2"/><text x="126" y="216" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="144" y="202" font-size="13" font-weight="400" fill="#454B55" text-anchor="start">alerts.json</text>
  <path d="M300 262 H694" stroke="#1F4E8C" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <circle cx="326" cy="262" r="11" fill="#1F4E8C" stroke="#FFFFFF" stroke-width="2"/><text x="326" y="266" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="344" y="252" font-size="13" font-weight="400" fill="#454B55" text-anchor="start">push with no amount, with buttons</text>
  <path d="M700 312 H884" stroke="#1F4E8C" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <circle cx="726" cy="312" r="11" fill="#1F4E8C" stroke="#FFFFFF" stroke-width="2"/><text x="726" y="316" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="744" y="302" font-size="13" font-weight="400" fill="#454B55" text-anchor="start">notification</text>
  <rect x="820" y="336" width="140" height="40" rx="4" fill="#C4D7EE" stroke="#1F4E8C" stroke-width="1.5"/>
  <circle cx="840" cy="356" r="11" fill="#1F4E8C" stroke="#FFFFFF" stroke-width="2"/><text x="840" y="360" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="860" y="361" font-size="14" font-weight="600" fill="#12151A" text-anchor="start">you tap</text>
