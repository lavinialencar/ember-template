    <symbol id="gear" viewBox="0 0 48 48">
      <path d="M24 6 L28 10 L34 8 L35 14 L41 16 L39 22 L43 26 L38 30 L39 36 L33 36 L30 42 L24 39 L18 42 L15 36 L9 36 L10 30 L5 26 L9 22 L7 16 L13 14 L14 8 L20 10 Z" fill="#C4D7EE" stroke="#1F4E8C" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="24" cy="24" r="6" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="2.5"/>
    </symbol>
  
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
