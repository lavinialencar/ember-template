  <circle cx="864" cy="440" r="11" fill="#1F4E8C" stroke="#FFFFFF" stroke-width="2"/><text x="864" y="444" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">5A</text>
  <text x="846" y="430" font-size="13" font-weight="400" fill="#454B55" text-anchor="end">signed body (HMAC)</text>
  <path d="M300 482 H694" stroke="#1F4E8C" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
