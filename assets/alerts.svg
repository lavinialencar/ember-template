      <path d="M12 21 V36 M20 21 V36 M28 21 V36 M36 21 V36" stroke="#1F4E8C" stroke-width="3"/>
      <rect x="6" y="38" width="36" height="4" fill="#1F4E8C"/>
    </symbol>
