    </symbol>
    <symbol id="phone" viewBox="0 0 48 64">
      <rect x="8" y="3" width="32" height="58" rx="4" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="2.5"/>
      <rect x="12" y="10" width="24" height="40" fill="#C4D7EE"/>
      <path d="M20 55 H28" stroke="#1F4E8C" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="cylinder" viewBox="0 0 48 48">
      <path d="M8 10 V38 A16 5 0 0 0 40 38 V10" fill="#C4D7EE" stroke="#1F4E8C" stroke-width="2.5"/>
      <ellipse cx="24" cy="10" rx="16" ry="5" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="2.5"/>
      <path d="M8 24 A16 5 0 0 0 40 24" fill="none" stroke="#1F4E8C" stroke-width="2"/>
    </symbol>
    <symbol id="terminal" viewBox="0 0 48 48">
      <rect x="4" y="8" width="40" height="32" rx="4" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="2.5"/>
      <path d="M4 15 H44" stroke="#1F4E8C" stroke-width="2"/>
      <path d="M11 23 L17 28 L11 33 M21 33 H30" fill="none" stroke="#1F4E8C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="filter" viewBox="0 0 48 48">
      <path d="M6 8 H42 L28 26 V40 L20 36 V26 Z" fill="#C4D7EE" stroke="#1F4E8C" stroke-width="2.5" stroke-linejoin="round"/>
    </symbol>
    <symbol id="bell" viewBox="0 0 48 48">
      <path d="M12 34 V22 A12 12 0 0 1 36 22 V34 L40 38 H8 Z" fill="#C4D7EE" stroke="#1F4E8C" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M20 42 A4 4 0 0 0 28 42" fill="none" stroke="#1F4E8C" stroke-width="2.5"/>
    </symbol>
    <symbol id="chart" viewBox="0 0 48 48">
      <rect x="4" y="6" width="40" height="36" rx="4" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="2.5"/>
      <rect x="11" y="26" width="6" height="10" fill="#86AEDB"/>
      <rect x="21" y="18" width="6" height="18" fill="#3F78BD"/>
      <rect x="31" y="22" width="6" height="14" fill="#1F4E8C"/>
    </symbol>
    <symbol id="lock" viewBox="0 0 48 48">
