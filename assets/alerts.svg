      <circle cx="24" cy="31" r="3" fill="#1F4E8C"/>
    </symbol>
    <symbol id="server" viewBox="0 0 48 48">
      <rect x="6" y="6" width="36" height="16" rx="2" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="2.5"/>
      <rect x="6" y="26" width="36" height="16" rx="2" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="2.5"/>
      <circle cx="13" cy="14" r="2" fill="#1F4E8C"/><circle cx="13" cy="34" r="2" fill="#1F4E8C"/>
