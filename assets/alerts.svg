  <rect x="1" y="1" width="1198" height="738" fill="#FFFFFF" stroke="#DDE1E7" stroke-width="2"/>
  <text x="32" y="46" font-size="21" font-weight="700" fill="#12151A">Path of an alert up to your tap</text>
  <text x="32" y="70" font-size="14" fill="#454B55">the push only says the type and level; the details stay in the dashboard</text>
  <rect x="15" y="96" width="170" height="72" rx="4" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="1.5"/>
  <use href="#bell" x="23" y="110" width="40" height="40"/>
