<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="t d" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif">
  <title id="t">Path of an alert in Ember</title>
  <desc id="d">1 alerts.py writes alerts.json. 2 notify.py sends ntfy a push with no amount or name, with buttons. 3 ntfy delivers it to the phone. 4 you tap a button. Path A, public ntfy.sh: 5A the button posts an HMAC-signed body to the reply topic, 6A on the next run notify.py reads the reply topic, 7A checks the signature and writes the state. Path B, self-hosted ntfy: 5B the button calls the POST /alert webhook of scheduler.py with the token in the header, 6B the scheduler validates and writes the state under a lock; a wrong token gets 403 and the IP is blocked after 5 errors.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E8C"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#454B55"/>
    </marker>
    <symbol id="bank" viewBox="0 0 48 48">
