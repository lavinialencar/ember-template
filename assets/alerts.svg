  <text x="344" y="472" font-size="13" font-weight="400" fill="#454B55" text-anchor="start">next run: reads replies</text>
  <path d="M300 524 H494" stroke="#1F4E8C" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <circle cx="326" cy="524" r="11" fill="#1F4E8C" stroke="#FFFFFF" stroke-width="2"/><text x="326" y="528" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">7A</text>
  <text x="344" y="514" font-size="13" font-weight="400" fill="#454B55" text-anchor="start">checks and writes</text>
  <text x="610" y="529" font-size="13" font-weight="600" fill="#B23A3A" text-anchor="start">wrong signature: ignored</text>
  <rect x="24" y="562" width="1152" height="150" fill="none" stroke="#86AEDB" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="36" y="582" font-size="13" font-weight="600" fill="#454B55" letter-spacing="0.5">B: SELF-HOSTED NTFY, WITH WEBHOOK</text>
  <path d="M890 612 H1079" stroke="#1F4E8C" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <circle cx="916" cy="612" r="11" fill="#1F4E8C" stroke="#FFFFFF" stroke-width="2"/><text x="916" y="616" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">5B</text>
  <text x="934" y="602" font-size="13" font-weight="400" fill="#454B55" text-anchor="start">POST /alert with token</text>
  <path d="M1085 664 H506" stroke="#1F4E8C" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <circle cx="1059" cy="664" r="11" fill="#1F4E8C" stroke="#FFFFFF" stroke-width="2"/><text x="1059" y="668" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">6B</text>
  <text x="1041" y="654" font-size="13" font-weight="400" fill="#454B55" text-anchor="end">validates and writes, under a lock</text>
  <text x="1075" y="700" font-size="13" font-weight="600" fill="#B23A3A" text-anchor="end">wrong token: 403; 5 errors: blocked</text>
