  <text x="1053" y="228" font-size="14" font-weight="600" fill="#12151A" text-anchor="middle">Celular</text>
  <text x="1053" y="247" font-size="13" fill="#454B55" text-anchor="middle">app do ntfy</text>
  <use href="#nuvem" x="1025" y="424" width="56" height="56"/>
  <text x="1053" y="498" font-size="14" font-weight="600" fill="#12151A" text-anchor="middle">ntfy.sh</text>
  <text x="1053" y="517" font-size="13" fill="#454B55" text-anchor="middle">tópico secreto</text>

