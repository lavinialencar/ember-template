  <g font-size="13" fill="#454B55">
    <text x="172" y="219">consentimento</text>
    <text x="250" y="254" text-anchor="middle">extrato</text>
    <text x="516" y="252" text-anchor="middle">grava</text>
    <text x="724" y="252" text-anchor="middle">classifica</text>
    <text x="840" y="361">avisa</text>
    <text x="640" y="361">monta</text>
    <text x="507" y="361" text-anchor="end">cifra</text>
