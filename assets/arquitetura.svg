<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif">
  <title id="t">Arquitetura do Ember</title>
  <desc id="d">Os bancos compartilham dados pela Pluggy com consentimento. Na sua máquina, a coleta baixa extrato e faturas, consulta o CNAE na BrasilAPI e grava JSON em data. As regras classificam, os alertas vão pelo ntfy para o celular sem valor nem nome, o painel é montado a partir de data e o backup sai cifrado para uma pasta na nuvem. Opcionalmente, a mesma rotina roda num servidor em casa com Postgres, agendador, ntfy próprio e n8n, alcançado pelo Tailscale.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E8C"/>
    </marker>
    <marker id="seta-cinza" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#454B55"/>
    </marker>
    <symbol id="banco" viewBox="0 0 48 48">
      <path d="M5 17 L24 6 L43 17 Z" fill="#C4D7EE" stroke="#1F4E8C" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M12 21 V36 M20 21 V36 M28 21 V36 M36 21 V36" stroke="#1F4E8C" stroke-width="3"/>
      <rect x="6" y="38" width="36" height="4" fill="#1F4E8C"/>
    </symbol>
    <symbol id="nuvem" viewBox="0 0 48 48">
      <path d="M14 36 H35 A8 8 0 0 0 36 20 A11 11 0 0 0 15 18 A9 9 0 0 0 14 36 Z" fill="#C4D7EE" stroke="#1F4E8C" stroke-width="2.5" stroke-linejoin="round"/>
    </symbol>
    <symbol id="celular" viewBox="0 0 48 64">
      <rect x="8" y="3" width="32" height="58" rx="4" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="2.5"/>
      <rect x="12" y="10" width="24" height="40" fill="#C4D7EE"/>
      <path d="M20 55 H28" stroke="#1F4E8C" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="cilindro" viewBox="0 0 48 48">
      <path d="M8 10 V38 A16 5 0 0 0 40 38 V10" fill="#C4D7EE" stroke="#1F4E8C" stroke-width="2.5"/>
      <ellipse cx="24" cy="10" rx="16" ry="5" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="2.5"/>
      <path d="M8 24 A16 5 0 0 0 40 24" fill="none" stroke="#1F4E8C" stroke-width="2"/>
    </symbol>
    <symbol id="terminal" viewBox="0 0 48 48">
      <rect x="4" y="8" width="40" height="32" rx="4" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="2.5"/>
      <path d="M4 15 H44" stroke="#1F4E8C" stroke-width="2"/>
      <path d="M11 23 L17 28 L11 33 M21 33 H30" fill="none" stroke="#1F4E8C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="filtro" viewBox="0 0 48 48">
      <path d="M6 8 H42 L28 26 V40 L20 36 V26 Z" fill="#C4D7EE" stroke="#1F4E8C" stroke-width="2.5" stroke-linejoin="round"/>
    </symbol>
    <symbol id="sino" viewBox="0 0 48 48">
      <path d="M12 34 V22 A12 12 0 0 1 36 22 V34 L40 38 H8 Z" fill="#C4D7EE" stroke="#1F4E8C" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M20 42 A4 4 0 0 0 28 42" fill="none" stroke="#1F4E8C" stroke-width="2.5"/>
    </symbol>
    <symbol id="grafico" viewBox="0 0 48 48">
      <rect x="4" y="6" width="40" height="36" rx="4" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="2.5"/>
      <rect x="11" y="26" width="6" height="10" fill="#86AEDB"/>
      <rect x="21" y="18" width="6" height="18" fill="#3F78BD"/>
      <rect x="31" y="22" width="6" height="14" fill="#1F4E8C"/>
    </symbol>
    <symbol id="cadeado" viewBox="0 0 48 48">
      <path d="M15 22 V15 A9 9 0 0 1 33 15 V22" fill="none" stroke="#1F4E8C" stroke-width="3"/>
      <rect x="10" y="22" width="28" height="20" rx="3" fill="#C4D7EE" stroke="#1F4E8C" stroke-width="2.5"/>
      <circle cx="24" cy="31" r="3" fill="#1F4E8C"/>
    </symbol>
    <symbol id="servidor" viewBox="0 0 48 48">
      <rect x="6" y="6" width="36" height="16" rx="2" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="2.5"/>
      <rect x="6" y="26" width="36" height="16" rx="2" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="2.5"/>
      <circle cx="13" cy="14" r="2" fill="#1F4E8C"/><circle cx="13" cy="34" r="2" fill="#1F4E8C"/>
      <path d="M22 14 H36 M22 34 H36" stroke="#86AEDB" stroke-width="2.5"/>
    </symbol>
    <symbol id="engrenagem" viewBox="0 0 48 48">
      <path d="M24 6 L28 10 L34 8 L35 14 L41 16 L39 22 L43 26 L38 30 L39 36 L33 36 L30 42 L24 39 L18 42 L15 36 L9 36 L10 30 L5 26 L9 22 L7 16 L13 14 L14 8 L20 10 Z" fill="#C4D7EE" stroke="#1F4E8C" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="24" cy="24" r="6" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="2.5"/>
    </symbol>
  </defs>

  <rect x="1" y="1" width="1198" height="698" fill="#FFFFFF" stroke="#DDE1E7" stroke-width="2"/>
  <text x="32" y="46" font-size="21" font-weight="700" fill="#12151A">Ember: do banco ao painel</text>
  <text x="32" y="70" font-size="14" fill="#454B55">os números seguem a ordem da rotina diária</text>

  <!-- zonas -->
