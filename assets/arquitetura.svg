    <circle cx="157" cy="215" r="11" fill="#1F4E8C" stroke="#FFFFFF" stroke-width="2"/><text x="157" y="219">1</text>
    <circle cx="250" cy="266" r="11" fill="#1F4E8C" stroke="#FFFFFF" stroke-width="2"/><text x="250" y="270">2</text>
    <circle cx="298" cy="340" r="11" fill="#1F4E8C" stroke="#FFFFFF" stroke-width="2"/><text x="298" y="344">3</text>
    <circle cx="516" cy="264" r="11" fill="#1F4E8C" stroke="#FFFFFF" stroke-width="2"/><text x="516" y="268">4</text>
    <circle cx="724" cy="264" r="11" fill="#1F4E8C" stroke="#FFFFFF" stroke-width="2"/><text x="724" y="268">5</text>
    <circle cx="825" cy="357" r="11" fill="#1F4E8C" stroke="#FFFFFF" stroke-width="2"/><text x="825" y="361">6</text>
    <circle cx="915" cy="452" r="11" fill="#1F4E8C" stroke="#FFFFFF" stroke-width="2"/><text x="915" y="456">7</text>
    <circle cx="625" cy="357" r="11" fill="#1F4E8C" stroke="#FFFFFF" stroke-width="2"/><text x="625" y="361">8</text>
