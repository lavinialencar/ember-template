    <rect x="24" y="90" width="266" height="470" fill="none" stroke="#DDE1E7" stroke-width="1.5"/>
    <text x="36" y="110">INTERNET</text>
    <rect x="320" y="90" width="580" height="470" fill="none" stroke="#86AEDB" stroke-width="1.5"/>
    <text x="332" y="110">SUA MÁQUINA</text>
    <rect x="930" y="90" width="246" height="210" fill="none" stroke="#DDE1E7" stroke-width="1.5"/>
    <text x="942" y="110">SEU CELULAR</text>
    <rect x="930" y="320" width="246" height="240" fill="none" stroke="#DDE1E7" stroke-width="1.5"/>
    <text x="942" y="340">INTERNET</text>
    <rect x="320" y="590" width="856" height="92" fill="none" stroke="#86AEDB" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="332" y="610">OPCIONAL: SERVIDOR EM CASA, PELO TAILSCALE</text>
  </g>

