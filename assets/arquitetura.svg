  <use href="#nuvem" x="129" y="238" width="56" height="56"/>
  <text x="157" y="312" font-size="14" font-weight="600" fill="#12151A" text-anchor="middle">Pluggy + MeuPluggy</text>
  <rect x="64" y="370" width="186" height="40" rx="4" fill="#FFFFFF" stroke="#86AEDB" stroke-width="1.5"/>
  <text x="157" y="395" font-size="14" font-weight="600" fill="#12151A" text-anchor="middle">BrasilAPI (CNPJ)</text>
  <use href="#nuvem" x="110" y="450" width="52" height="52"/>
  <use href="#cadeado" x="160" y="458" width="34" height="34"/>
  <text x="157" y="524" font-size="14" font-weight="600" fill="#12151A" text-anchor="middle">Pasta na nuvem</text>

  <!-- maquina, linha 1 -->
  <rect x="345" y="212" width="130" height="104" rx="4" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="1.5"/>
  <use href="#terminal" x="390" y="220" width="40" height="40"/>
  <text x="410" y="282" font-size="14" font-weight="600" fill="#12151A" text-anchor="middle">Coleta</text>
  <text x="410" y="301" font-size="13" fill="#454B55" text-anchor="middle">atualizar.py</text>

  <rect x="560" y="212" width="130" height="104" rx="4" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="1.5"/>
  <use href="#cilindro" x="605" y="220" width="40" height="40"/>
  <text x="625" y="282" font-size="14" font-weight="600" fill="#12151A" text-anchor="middle">data/</text>
  <text x="625" y="301" font-size="13" fill="#454B55" text-anchor="middle">JSON local</text>

  <rect x="760" y="212" width="130" height="104" rx="4" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="1.5"/>
  <use href="#filtro" x="805" y="220" width="40" height="40"/>
  <text x="825" y="282" font-size="14" font-weight="600" fill="#12151A" text-anchor="middle">Regras</text>
  <text x="825" y="301" font-size="13" fill="#454B55" text-anchor="middle">fluxo.py</text>

  <!-- maquina, linha 2 -->
  <rect x="345" y="400" width="130" height="104" rx="4" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="1.5"/>
  <use href="#cadeado" x="390" y="408" width="40" height="40"/>
  <text x="410" y="470" font-size="14" font-weight="600" fill="#12151A" text-anchor="middle">Backup</text>
  <text x="410" y="489" font-size="13" fill="#454B55" text-anchor="middle">backup.py</text>

  <rect x="560" y="400" width="130" height="104" rx="4" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="1.5"/>
  <use href="#grafico" x="605" y="408" width="40" height="40"/>
  <text x="625" y="470" font-size="14" font-weight="600" fill="#12151A" text-anchor="middle">Painel</text>
