<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js '__CSP_SCRIPT_HASH__'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Painel Ember</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha384-bs/nf9FbdNouRbMiFcrcZfLXYPKiPaGVGplVbv7dLGECccEXDW+S3zjqSKR5ZEaD" crossorigin="anonymous"></script>
<style>
:root{
  --ink:#12151A; --ink2:#454B55; --ink3:#7A818C; --rule:#DDE1E7; --paper:#FFFFFF; --ground:#F4F5F7;
  --accent:#1F4E8C; --accent-soft:#E4EDF8;
  --b1:#0F2E57; --b2:#1F4E8C; --b3:#3F78BD; --b4:#86AEDB; --b5:#C4D7EE;
  --in1:#2F7D5A; --in2:#6FAF92; --in3:#B4D9C6; --bom:#2F7D5A; --ruim:#B23A3A;
  --vazio:#ECEEF2; --vazio-b:#9AA1AD;
  --display:'Archivo','Helvetica Neue',Arial,sans-serif; --body:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#ECEEF2; --ink2:#B4BAC4; --ink3:#8A919C; --rule:#2E343D; --paper:#171B21; --ground:#0F1216;
    --accent:#8FB4E6; --accent-soft:#1B2A40;
    --b1:#BFD6F3; --b2:#8FB4E6; --b3:#5F92D0; --b4:#3B6BA6; --b5:#24446F;
    --in1:#7CCBA2; --in2:#4E9C76; --in3:#2F6B50; --bom:#7CCBA2; --ruim:#E58F8F;
    --vazio:#232830; --vazio-b:#6B7480;
  }
}
:root[data-theme="dark"]{
  --ink:#ECEEF2; --ink2:#B4BAC4; --ink3:#8A919C; --rule:#2E343D; --paper:#171B21; --ground:#0F1216;
  --accent:#8FB4E6; --accent-soft:#1B2A40;
  --b1:#BFD6F3; --b2:#8FB4E6; --b3:#5F92D0; --b4:#3B6BA6; --b5:#24446F;
  --in1:#7CCBA2; --in2:#4E9C76; --in3:#2F6B50; --bom:#7CCBA2; --ruim:#E58F8F;
  --vazio:#232830; --vazio-b:#6B7480;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:24px 72px}
.folha{max-width:1120px;margin:0 auto}
h1{font-family:var(--display);font-weight:700;font-size:clamp(32px,5vw,46px);line-height:1.02;margin:0 0 8px;letter-spacing:-.02em}
h2{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.15;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:17px;margin:0 0 8px}
p{margin:0 0 10px;max-width:none}
html{scroll-behavior:smooth}
.cab{background:var(--paper);padding:clamp(18px,3vw,32px) clamp(18px,3vw,32px) 12px}
.cab h1{margin:0 0 4px}
.meta{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.03em;color:var(--ink3);max-width:none}
.sumario{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;overflow-x:auto;padding:0 clamp(12px,2.6vw,28px);border-bottom:1px solid var(--rule)}
.sumario a{flex:none;font-family:var(--mono);font-size:12px;letter-spacing:.03em;color:var(--ink2);text-decoration:none;padding:11px 12px 9px;border-bottom:2px solid transparent}
.sumario a:hover{color:var(--accent)}
.sumario a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sumario a.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.topo{background:var(--paper);padding:2px clamp(18px,3vw,32px) clamp(18px,3vw,28px);border-bottom:3px solid var(--ink)}
section{scroll-margin-top:52px}
.faixa{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-size:22px;margin:30px 0 10px;padding-top:14px;border-top:1px solid var(--rule)}
.faixa span{font-family:var(--mono);font-weight:400;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.kpis{margin-top:4px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--rule)}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.alerta{margin-top:26px;margin-bottom:10px}
.alerta .tit .cad{color:var(--ink3);text-transform:none;letter-spacing:0;font-family:var(--body);font-size:12px;margin-left:12px}
.alerta .tit{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ruim);font-weight:500;margin-bottom:20px}
.alerta .itens{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(var(--linhas,3),auto);grid-auto-flow:column;gap:26px 56px}
@media (max-width:760px){.alerta .itens{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-auto-flow:row}}
.alerta .it{display:flex;gap:16px;align-items:flex-start;min-width:0}
.alerta .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:var(--mono);font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center}
.alerta .tx{display:flex;flex-direction:column;gap:4px;min-width:0;padding-top:2px}
.alerta .tx b{font-size:14px;font-weight:600;color:var(--ink)}
.alerta .tx span{font-size:13px;color:var(--ink2);line-height:1.5}
.alerta .it.venc .num{background:color-mix(in srgb,var(--ruim) 14%,transparent);color:var(--ruim)}
.alerta .it.venc .tx b,.alerta .it.venc .tx span{color:var(--ruim)}
.alerta .it.venc .tx span{font-weight:600}
.kpi{background:var(--paper);padding:16px 18px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .l{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.kpi .n{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:26px;line-height:1.1;font-weight:600;letter-spacing:-.01em;margin-top:4px;white-space:nowrap}
.kpi .ln{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:8px}
.kpi .m{font-family:var(--mono);font-size:11px;color:var(--ink2)}
.kpi .spark{display:block;width:100%;height:28px;margin-top:12px}
.chip{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.02em;padding:2px 7px;white-space:nowrap;background:var(--ground);color:var(--ink2)}
.chip.bom{color:var(--bom);background:color-mix(in srgb,var(--bom) 13%,transparent)}
.chip.ruim{color:var(--ruim);background:color-mix(in srgb,var(--ruim) 13%,transparent)}
.ressalva{font-size:12px;color:var(--ink3);margin:10px 0 0;max-width:none;line-height:1.5}
.rot{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
section{background:var(--paper);margin-top:16px;padding:clamp(18px,3vw,32px)}
.sub{color:var(--ink2);margin-bottom:40px;max-width:none}
h3 + .nota{margin-bottom:28px}
.dois{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:36px 72px;align-items:stretch}
.dois > div{display:flex;flex-direction:column;min-width:0}
.cx{position:relative;width:100%;flex:1 1 auto;max-height:520px}
.cx.rosca{flex:none;height:300px;max-width:440px;margin-inline:auto}
.cx.fixo{flex:none;height:310px}
.lista.duas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:0 72px}
.zona{margin-top:44px;padding-top:28px;border-top:1px solid var(--rule)}
.alto{min-height:340px}.medio{min-height:280px}.baixo{min-height:220px}
.cx > canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.lista{margin:0;padding:0;list-style:none}
.lista li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 16px;padding:10px 0;border-bottom:1px solid var(--rule)}
.lista .nome{font-weight:600}
.lista .det{grid-column:1 / -1;font-size:13px;color:var(--ink2)}
.lista .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;text-align:right}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;background:var(--ground);color:var(--ink2);margin-left:6px;vertical-align:1px}
.tag.novo{background:var(--accent-soft);color:var(--accent)}
.tag.crit{color:var(--ruim)}
.destaque{background:var(--ground);padding:14px 18px;margin:16px 0 0;max-width:none}
.destaque p:last-child{margin-bottom:0}
.nota{font-size:14px;color:var(--ink2);max-width:none;line-height:1.6}
.insight{font-size:14px;color:var(--ink2);margin:18px 0 0;max-width:none;line-height:1.6}
.dois.centro{align-items:center}
.cx.grande{height:340px}
.cx.livre{max-height:none}
.rl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px}
.rl .cx.rosca{flex:none;width:200px;height:200px;max-width:none;margin:0}
.rl .leg{flex:1 1 210px;flex-direction:column;gap:12px;margin-top:0;font-size:14px}
.tres{display:grid;grid-template-columns:300px minmax(0,1fr);gap:36px 88px;align-items:start;margin-top:34px}
.ff{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 36px;max-width:820px}
.tres h3{margin-bottom:18px}
.cx.plano{flex:none;height:300px;max-height:none}
.cob{display:flex;flex-direction:column;align-items:center;text-align:center}
.cob h3{margin-bottom:38px}
.cob .leg{margin-top:36px;justify-content:center;flex-direction:column;gap:16px}
.tres .cx.rosca{width:210px;height:210px;max-width:none;margin:0}
@media (max-width:900px){.tres{grid-template-columns:1fr}.ff{grid-template-columns:1fr}}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2);margin-top:8px}
.leg span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;background:var(--k);vertical-align:-1px}
.leg span.vz::before{border:1px dashed var(--vazio-b)}
.rodape{margin-top:16px;padding:16px 22px;background:var(--paper);font-size:14px;color:var(--ink2)}
.rodape p{max-width:none;margin:0 0 6px}
@media (max-width:640px){ h2{font-size:21px} .alto{min-height:300px} }
</style>

<div class="folha">
  <div class="cab">
    <h1>Painel Ember</h1>
    <p class="meta" id="meta"></p>
  </div>
  <nav class="sumario" aria-label="Seções">
    <a href="#mensal">Mês a mês</a><a href="#gasto">Onde vai</a><a href="#cartoes">Cartões</a><a href="#assinaturas">Assinaturas</a><a href="#dividas">Dívidas</a><a href="#entradas">Entradas</a><a href="#pontos">Pontos</a><a href="#regras">Regras</a>
  </nav>
  <div class="topo">
    <div class="alerta" id="alerta"></div>
    <h2 class="faixa">Mês atual <span id="fx-atual"></span></h2>
    <div class="kpis" id="kpis-mes"></div>
    <p class="ressalva" id="ress-mes"></p>
    <h2 class="faixa">Mês anterior <span id="fx-ant"></span></h2>
    <div class="kpis" id="kpis"></div>
    <p class="ressalva" id="ress-ant"></p>
  </div>

  <section id="mensal"></section>
  <section id="gasto"></section>
  <section id="cartoes"></section>
  <section id="assinaturas"></section>
  <section id="dividas"></section>
  <section id="entradas"></section>
  <section id="pontos"></section>
  <section id="regras"></section>

  <div class="rodape">
    <p><span class="rot">Como ler</span></p>
    <p id="rodape-txt"></p>
  </div>
</div>

<script>
const D = __DADOS__;
const $ = id => document.getElementById(id);
const brl = n => Math.round(n).toLocaleString('pt-BR');
const R = n => 'R$ ' + brl(n);
const R2 = n => 'R$ ' + (+n || 0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const ml = ym => MES[+ym.slice(5)-1] + '/' + ym.slice(2,4);
const dl = d => d.slice(8,10) + '/' + d.slice(5,7);
const M = ym => D.meses.find(x => x.mes === ym);
const ma = ym => MES[+ym.slice(5)-1];
const dmy = iso => iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4);
const mesMais = (ym,n) => { const k = +ym.slice(0,4)*12 + +ym.slice(5,7) - 1 + n; return Math.floor(k/12)+'-'+String(k%12+1).padStart(2,'0'); };
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
const soma = (xs, f) => xs.reduce((a,x) => a + (f(x) || 0), 0);
/* escapa texto de fora (alerta, cadastro manual, regras) antes de entrar em innerHTML;
   numero e string fixa do proprio template nao precisam, mas escapar nao quebra nada */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NF = Math.max(D.fechados.length, 1);
const AT = D.ref.atual, ANT = D.ref.anterior, ANT2 = D.ref.anterior2, AB = D.ref.aberta;
$('meta').textContent = 'Pessoal · atualizado em ' + dmy(D.gerado);
$('fx-atual').textContent = ml(AT) + ', em andamento até ' + dl(D.gerado);
$('fx-ant').textContent = ml(ANT) + ', fechado';
const incompl = D.meses.filter(m => m.incompleto).map(m => ml(m.mes));
$('rodape-txt').textContent = (incompl.length ? incompl.join(', ') + ' têm histórico incompleto: os dados começam antes e faltam as compras das faturas antigas. ' : '') + cap(ml(AT)) + ' está em andamento. Gasto é só o de escopo pessoal: o que suas regras marcam como escopo pj fica de fora e aparece à parte. Dívida nova não entra como renda. Estornos ficam fora dos gráficos de gasto.';
const mil = v => v >= 1000 ? (v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1}) + ' mil' : String(v);

/* ---------- dados derivados ---------- */
const dv = D.dividas;
const fatAb = D.faturas_abertas || [];
const fatAbTot = soma(fatAb, f => f.saldo);
const dividasContrato = soma(dv.filter(d => d.tipo === 'contrato'), d => d.a_pagar);
const infTot = soma(dv.filter(d => d.tipo === 'informal'), d => d.a_pagar);
const custo12 = D.custo_divida_12m + D.custo_divida_aberta;
const A = D.assinaturas;
const recTot = soma(A.itens, i => i.valor);
const espor12 = soma(A.esporadicas, e => e.total12);
const cob = D.cobertura, nL = Math.max(cob.regra_linhas + cob.cinza_linhas, 1), nV = Math.max(cob.regra_valor + cob.cinza_valor, 1);

/* ---------- textos e KPIs (nao dependem de tema) ---------- */
const cur = M(ANT), prev = M(ANT2), set_ = M(AT);
const picoEq = D.fechados.reduce((a,m) => M(m).equip > (a ? M(a).equip : 1000) ? m : a, '');
const pc = (a,b) => b ? Math.round((a-b)/Math.abs(b)*100) : 0;
const chip = (a, b, sobeBom, neutro) => {
  const p = pc(a,b), seta = p>0 ? '▲' : p<0 ? '▼' : '■';
  if (neutro) return `<span class="chip" title="contra ${ml(ANT2)}">${seta} ${Math.abs(p)}% ${p>0?'mais':p<0?'menos':'igual'}</span>`;
  const bom = p===0 ? null : ((p>0)===sobeBom);
  return `<span class="chip ${bom===null?'':bom?'bom':'ruim'}" title="contra ${ml(ANT2)}">${seta} ${Math.abs(p)}% ${bom===null?'igual':bom?'melhor':'pior'}</span>`;
};
const serie = fn => D.meses.filter(m => !m.incompleto && !m.parcial).map(fn);
const spark = (vals, cor) => {
  if (vals.length < 2) return '';
  const w = 140, h = 26, mn = Math.min(...vals), mx = Math.max(...vals), sp = (mx-mn) || 1;
  const pts = vals.map((v,i) => [ (i/(vals.length-1))*w, h-3-((v-mn)/sp)*(h-8) ]);
  const linha = pts.map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const ult = pts[pts.length-1], c1 = cor || 'var(--b3)', c2 = cor ? 'var(--ink2)' : 'var(--b1)', fill = cor ? 'var(--rule)' : 'var(--b5)';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,${h} ${linha} ${w},${h}" fill="${fill}" opacity=".7"/><polyline points="${linha}" fill="none" stroke="${c1}" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="${ult[0].toFixed(1)}" cy="${ult[1].toFixed(1)}" r="2.6" fill="${c2}"/></svg>`;
};
const totClasse = D.media.fixo+D.media.essencial+D.media.discric+D.media.misto+D.media.cinza;
const pctCinza = totClasse ? Math.round(D.media.cinza/totClasse*100) : 0;
const resAnt = cur.salario-cur.gasto, resAnt2 = prev.salario-prev.gasto;
const vida = m => m.fixo + m.essencial - m.custo_divida;
const mediaVida = D.media.fixo + D.media.essencial - D.media.custo_divida;
const tile = (l, n, ch, m, sp) => `<div class="kpi"><span class="l">${l}</span><span class="n">${n}</span><div class="ln">${ch||''}<span class="m">${m}</span></div>${sp||''}</div>`;
const negR = v => (v<0?'− ':'') + R(Math.abs(v));
const ref = txt => `<span class="chip ref">${txt}</span>`;

const NIVEL = {vencido: 'venc', atencao: '', info: ''};
const itensAtencao = (D.alertas || []).slice(0, 5).map(a => [NIVEL[a.nivel] || '', a.titulo, a.curto || a.detalhe])
  .concat(dividasContrato ? [['', 'Dívida com contrato', `${R(dividasContrato)} no total, fora as faturas em aberto`]] : []);
$('alerta').innerHTML = `<div class="tit">Atenção hoje${D.lido_em ? `<span class="cad">itens do cadastro manual, lidos em ${dl(D.lido_em)}</span>` : ''}</div>
  <div class="itens" style="--linhas:${Math.max(Math.ceil(itensAtencao.length/2),1)}">${itensAtencao.length ? itensAtencao.map((it,n) => `<div class="it ${it[0]}"><span class="num">${n+1}</span><div class="tx"><b>${esc(it[1])}</b><span>${esc(it[2])}</span></div></div>`).join('') : '<div class="it"><div class="tx"><span>Nada pedindo ação agora.</span></div></div>'}</div>`;

$('kpis-mes').innerHTML =
  tile('Entrada', R(set_.salario), ref('parcial'), `${ma(ANT)}: ${R(cur.salario)}`) +
  tile('Saída', R(set_.gasto), ref('parcial'), `${ma(ANT)}: ${R(cur.gasto)}`) +
  tile('Resultado', negR(set_.salario-set_.gasto), ref('parcial'), `${ma(ANT)}: ${negR(resAnt)}`) +
  tile('Custo de vida', R(vida(set_)), ref('parcial'), `${ma(ANT)}: ${R(vida(cur))}`) +
  tile('Dívida nova', R(set_.divida_entra), ref(set_.divida_entra ? 'no mês' : 'nenhuma até agora'), `${ma(ANT)}: ${R(cur.divida_entra)}`) +
  tile('Custo da dívida', R(set_.custo_divida), set_.custo_divida ? `<span class="chip ruim">tem juros</span>` : ref('zero até agora'), `${ma(ANT)}: ${R(cur.custo_divida)}`);
$('ress-mes').textContent = `${cap(ml(AT))} em andamento: ainda faltam entradas e saídas do resto do mês. A saída soma o que venceu no mês (faturas) e a conta até hoje.` + (D.custo_divida_aberta ? ` A fatura aberta de ${ml(AB)} já tem ${R(D.custo_divida_aberta)} de juros e encargos.` : '');

$('kpis').innerHTML =
  tile('Entrada', R(cur.salario), chip(cur.salario, prev.salario, true), `média ${R(D.media.salario)}`, spark(serie(m=>m.salario))) +
  tile('Saída', R(cur.gasto), chip(cur.gasto, prev.gasto, false), `média ${R(D.media.gasto)}`, spark(serie(m=>m.gasto))) +
  tile('Resultado', negR(resAnt), chip(resAnt, resAnt2, true), `média ${negR(D.media.salario-D.media.gasto)}`, spark(serie(m=>m.salario-m.gasto))) +

const charts = [];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function desenhar(){
  charts.splice(0).forEach(c => c.destroy());
  const k = {ink:css('--ink'), ink2:css('--ink2'), ink3:css('--ink3'), rule:css('--rule'), acc:css('--accent'), paper:css('--paper'),
    in1:css('--in1'), in2:css('--in2'), in3:css('--in3'), neg:css('--ruim'),
    b1:css('--b1'), b2:css('--b2'), b3:css('--b3'), b4:css('--b4'), b5:css('--b5'), vz:css('--vazio'), vzb:css('--vazio-b')};
  const ciclo = [k.b1, k.b2, k.b3, k.b4, k.b5];
  Chart.defaults.font.family = "'IBM Plex Sans', Arial, sans-serif";
  Chart.defaults.font.size = 12;
  Chart.defaults.color = k.ink2;
  Chart.defaults.borderColor = k.rule;
  Chart.defaults.animation = false;
  Chart.defaults.maintainAspectRatio = false;
  Chart.defaults.plugins.legend.labels.boxWidth = 10;
  Chart.defaults.plugins.legend.labels.boxHeight = 10;
  Chart.defaults.plugins.tooltip.callbacks.label = c => ` ${c.dataset.label}: ${R(c.raw)}`;
  const ticksR = {callback: v => mil(v)};
  const eixo = extra => Object.assign({grid:{color:k.rule}, border:{display:false}, ticks:ticksR}, extra||{});
  const semGrade = {grid:{display:false}, border:{color:k.rule}, ticks:{maxRotation:0, minRotation:0, autoSkip:true, autoSkipPadding:16}};
  /* "sem classificar" e "a receber": tom liso claro com contorno tracejado, sem textura */
  const mk = (id, cfg) => {
    cfg.data.datasets.forEach(ds => {
      const bg = ds.backgroundColor, arr = Array.isArray(bg) ? bg : null;
      if ((arr && arr.includes(k.vz)) || bg === k.vz) {
        const base = ds.borderColor;
        ds.borderColor = arr ? arr.map((c,i) => c === k.vz ? k.vzb : (Array.isArray(base) ? base[i] : base || c)) : k.vzb;
        ds.borderWidth = 1.2; ds.borderDash = [4,3];
      }
    });
    const el = $(id); if (el) charts.push(new Chart(el, cfg));
  };

  /* mensal */
  const meses = D.meses;
  const rot = meses.map(m => m.incompleto ? [ml(m.mes),'incompleto'] : m.parcial ? [ml(m.mes),'em andamento'] : ml(m.mes));
  mk('c-mensal', {type:'bar', data:{labels:rot, datasets:[
    {label:'Salário', data:meses.map(m=>m.salario), backgroundColor:k.in1, stack:'in'},
    {label:'13º', data:meses.map(m=>m.decimo), backgroundColor:k.in2, stack:'in'},
    {label:'Único e reembolso', data:meses.map(m=>m.unica+m.reembolso), backgroundColor:k.in3, stack:'in'},
    {label:'Fixo', data:meses.map(m=>m.fixo), backgroundColor:k.b1, stack:'out'},
    {label:'Essencial variável', data:meses.map(m=>m.essencial), backgroundColor:k.b2, stack:'out'},
    {label:'Discricionário', data:meses.map(m=>m.discric), backgroundColor:k.b3, stack:'out'},
    {label:'Misto', data:meses.map(m=>m.misto), backgroundColor:k.b4, stack:'out'},
    {label:'Sem classificar', data:meses.map(m=>m.cinza), backgroundColor:k.vz, stack:'out'},
    {type:'line', label:'Dívida nova', data:meses.map(m=>m.divida_entra||null), showLine:false, pointStyle:'rectRot', pointRadius:7, pointBackgroundColor:k.neg, pointBorderColor:k.paper, pointBorderWidth:1.5, order:0},
  ]}, options:{plugins:{legend:{position:'bottom'}}, scales:{x:Object.assign({stacked:true}, semGrade), y:eixo({stacked:true, beginAtZero:true})}}});

  /* classe */
  const a = D.media, tot = totClasse || 1;
  const nomes = ['Fixo compromissado','Essencial variável','Discricionário','Misto','Sem classificar'], vals = [a.fixo,a.essencial,a.discric,a.misto,a.cinza];
  mk('c-classe', {type:'doughnut', data:{labels:nomes, datasets:[{data:vals, backgroundColor:[k.b1,k.b2,k.b3,k.b4,k.vz], borderColor:k.paper, borderWidth:2}]},
    options:{cutout:'62%', plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>` ${c.label}: ${R(c.parsed)} por mês (${(c.parsed/tot*100).toFixed(0)}%)`}}}}});
  $('leg-classe').innerHTML = nomes.map((n,i)=>`<span class="${i===4?'vz':''}" style="--k:${['var(--b1)','var(--b2)','var(--b3)','var(--b4)','var(--vazio)'][i]}">${n} ${R(vals[i])}</span>`).join('');

  /* categorias */
  mk('c-cat', {type:'bar', data:{labels:D.categorias.map(c=>c.nome), datasets:[{label:'Por mês', data:D.categorias.map(c=>c.valor), backgroundColor:k.b2}]},
    options:{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:eixo({beginAtZero:true}), y:semGrade}}});

  /* cartoes */
  if (D.cartoes.length) {
    const vencs = D.cartoes[0].fechadas.map(f => ml(f.venc.slice(0,7))).concat([ml(AB) + ' aberta']);
    mk('c-cartoes', {type:'bar', data:{labels:vencs, datasets:D.cartoes.map((c,i)=>({label:c.nome, backgroundColor:ciclo[i % ciclo.length], data:c.fechadas.map(f=>f.total).concat([c.aberta_estimada])}))},
      options:{plugins:{legend:{position:'bottom'}}, scales:{x:semGrade, y:eixo({beginAtZero:true})}}});
  }
  const fut = D.futuro_cartao.filter(f => f.mes >= mesMais(AB,1));
  mk('c-futuro', {type:'bar', data:{labels:fut.map(f=>ml(f.mes)), datasets:[{label:'Parcelas', data:fut.map(f=>f.valor), backgroundColor:k.b4}]},
    options:{plugins:{legend:{display:false}}, scales:{x:semGrade, y:eixo({beginAtZero:true})}}});

  /* assinaturas: um bloco por grupo das suas regras; esporadico em tom vazio */
  const am = A.meses, esp = new Set(A.esporadicas.map(e => e.nome));
  mk('c-assin', {type:'bar', data:{labels:am.map(m=>ml(m.mes)), datasets:A.grupos.map((g,i) => (
    {label:g, data:am.map(m=>m[g]), backgroundColor:esp.has(g) ? k.vz : ciclo[i % ciclo.length], stack:'a'}))},
    options:{plugins:{legend:{position:'bottom'}}, scales:{x:Object.assign({stacked:true}, semGrade), y:eixo({stacked:true, beginAtZero:true})}}});

  /* dividas */
  mk('c-div', {type:'bar', data:{labels:dv.map(d=>d.nome).concat(fatAbTot ? ['Faturas vencidas (estimado)'] : []), datasets:[
    {label:'Pago', data:dv.map(d=>d.pago), backgroundColor:k.in1},
    {label:'A pagar', data:dv.map(d=>d.a_pagar).concat(fatAbTot ? [fatAbTot] : []), backgroundColor:dv.map(d => d.tipo === 'informal' ? k.b3 : k.b1).concat([k.neg])},
  ]}, options:{indexAxis:'y', plugins:{legend:{position:'bottom'}}, scales:{x:eixo({stacked:true, beginAtZero:true}), y:Object.assign({stacked:true}, semGrade)}}});
  const mm = D.meses.filter(m => !m.incompleto);
  mk('c-divmes', {type:'bar', data:{labels:mm.map(m=>ml(m.mes)), datasets:[
    {type:'bar', label:'Dívida nova', data:mm.map(m=>m.divida_entra), backgroundColor:k.neg, yAxisID:'y', order:2},
    {type:'line', label:'Custo da dívida', data:mm.map(m=>m.custo_divida), borderColor:k.ink2, backgroundColor:k.ink2, pointRadius:4, tension:.25, yAxisID:'y1', order:1},
  ]}, options:{plugins:{legend:{position:'bottom'}}, scales:{x:semGrade, y:eixo({beginAtZero:true, title:{display:true,text:'dívida nova'}}), y1:{position:'right', grid:{display:false}, border:{display:false}, beginAtZero:true, ticks:ticksR, title:{display:true,text:'custo'}}}}});

  /* recebiveis */
  mk('c-rec', {type:'bar', data:{labels:RB.map(r=>r.nome), datasets:[
    {label:'Recebido', data:RB.map(r=>r.recebidas.length*r.parcela), backgroundColor:k.in1},
    {label:'A receber', data:RB.map(r=>(r.parcelas_total-r.recebidas.length)*r.parcela), backgroundColor:k.vz},
  ]}, options:{indexAxis:'y', plugins:{legend:{position:'bottom'}}, scales:{x:eixo({stacked:true, beginAtZero:true}), y:Object.assign({stacked:true}, semGrade)}}});

  /* pontos */
  const pv = P.filter(p => p.reais).sort((a,b) => b.reais - a.reais);
  mk('c-pontos', {type:'bar', data:{labels:pv.map(p => p.programa), datasets:[{label:'R$ estimado', data:pv.map(p=>p.reais), backgroundColor:pv.map(p => p === primeiro ? k.in1 : k.in2)}]},
    options:{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:eixo({beginAtZero:true}), y:semGrade}}});

  /* cobertura */
  mk('c-cob', {type:'doughnut', data:{labels:['Com regra','Sem classificar'], datasets:[{data:[cob.regra_valor,cob.cinza_valor], backgroundColor:[k.b1,k.vz], borderColor:k.paper, borderWidth:2}]},
    options:{cutout:'62%', plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>` ${c.label}: ${R(c.parsed)} (${(c.parsed/nV*100).toFixed(0)}%)`}}}}});
  $('leg-cob').innerHTML = `<span style="--k:var(--b1)">Com regra ${R(cob.regra_valor)} (${(cob.regra_valor/nV*100).toFixed(0)}%)</span><span class="vz" style="--k:var(--vazio)">Sem classificar ${R(cob.cinza_valor)} (${(cob.cinza_valor/nV*100).toFixed(0)}%)</span>`;
}
try {
  const links = [...document.querySelectorAll('.sumario a')];
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + e.target.id)); }), {rootMargin:'-35% 0px -60% 0px'});
  document.querySelectorAll('section').forEach(sc => io.observe(sc));
} catch(e) {}
desenhar();
try {
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', desenhar);
  new MutationObserver(desenhar).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
} catch(e) {}
</script>
