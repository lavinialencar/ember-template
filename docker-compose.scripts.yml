# Ember's scripts on a server (a NAS or any always-on machine): daily routine and alert button webhook.
# Usage: docker compose -f docker-compose.scripts.yml up -d --build
# The whole repo (with data/ and .env) is mounted at /app: the container reads and writes the same files as the folder.
# network_mode host: reaches Postgres on localhost:5432 (docker-compose.yml) and serves the webhook on port 8082,
# which only Tailscale reaches. In .env: ALERT_WEBHOOK_URL=http://<server>.<tailnet>.ts.net:8082/alert and
# ALERT_WEBHOOK_TOKEN=<secret of 32+ characters; without it the webhook does not start>. TICKTICK_TOKEN (and TICKTICK_PROJECT_ID)
# are optional. The webhook only listens on EMBER_BIND (default 127.0.0.1): on the server, EMBER_BIND=<its Tailscale IP>
# (`tailscale ip -4`), never 0.0.0.0. The container runs without root (user ember, uid 1000): the owner of ./ on the server
# must be that uid, or change EMBER_UID/EMBER_GID at build time to match the folder owner.
# Time zone: EMBER_TZ (default America/Sao_Paulo).
services:
  ember-scripts:
    build:
      context: .
      dockerfile: Dockerfile.scripts
      args:
        EMBER_UID: ${EMBER_UID:-1000}
        EMBER_GID: ${EMBER_GID:-1000}
        EMBER_TZ: ${EMBER_TZ:-America/Sao_Paulo}
    container_name: ember-scripts
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${EMBER_TZ:-America/Sao_Paulo}
      EMBER_TZ: ${EMBER_TZ:-America/Sao_Paulo}
    volumes:
      - ./:/app
